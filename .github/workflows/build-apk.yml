name: Build Pure Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2.2'

    - name: Assemble Pure Offline Android App
      run: |
        mkdir -p android/app/src/main/java/com/myvault/app
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/assets

        cp -r index.html styles.css app.js crypto.js storage.js manifest.json icon.svg *.png android/app/src/main/assets/ || true

        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyVault"
        include ':app'
        EOF

        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.myvault.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.myvault.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        EOF

        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.myvault.app">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="false"
                android:label="My Vault"
                android:supportsRtl="true"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">My Vault</string>
        </resources>
        EOF

        cat << 'EOF' > android/app/src/main/java/com/myvault/app/MainActivity.java
        package com.myvault.app;

        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView mWebView;
            private ValueCallback<Uri[]> mFilePathCallback;
            private final static int FILECHOOSER_RESULTCODE = 1001;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                mWebView = new WebView(this);
                setContentView(mWebView);

                WebSettings settings = mWebView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setAllowUniversalAccessFromFileURLs(true);

                mWebView.setWebViewClient(new WebViewClient());
                mWebView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        mFilePathCallback = filePathCallback;
                        Intent intent = fileChooserParams.createIntent();
                        try {
                            startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                        } catch (Exception e) {
                            mFilePathCallback = null;
                            return false;
                        }
                        return true;
                    }
                });

                mWebView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILECHOOSER_RESULTCODE && mFilePathCallback != null) {
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        if (data.getDataString() != null) {
                            results = new Uri[]{Uri.parse(data.getDataString())};
                        }
                    }
                    mFilePathCallback.onReceiveValue(results);
                    mFilePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }
        }
        EOF

    - name: Compile APK with Gradle
      working-directory: ./android
      run: gradle assembleDebug --stacktrace

    - name: Upload Pure Offline APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVault-Pure-Offline.apk
        path: android/app/build/outputs/apk/debug/*.apk
