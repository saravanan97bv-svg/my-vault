<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1014" />
      <stop offset="50%" stop-color="#12080a" />
      <stop offset="100%" stop-color="#080304" />
    </radialGradient>

    <!-- Heritage Shield Crimson Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Platinum Highlight Gradient -->
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Golden Keystone Lock Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rim Accent -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- The Heritage Vault Shield Structure -->
  <g filter="url(#softGlow)">
    <!-- Outer Shield Crest -->
    <path d="M256 60 L410 120 C410 280 340 390 256 440 C172 390 102 280 102 120 Z" 
          fill="url(#shieldGrad)" />
    
    <!-- Inner Shield Inset (Deep Facet) -->
    <path d="M256 86 L386 138 C386 270 326 366 256 410 C186 366 126 270 126 138 Z" 
          fill="#1c0a0f" opacity="0.85" />
    
    <!-- Generational Family Tree of Life / Chronicle Branches -->
    <!-- Central Trunk -->
    <path d="M256 370 L256 260" stroke="url(#platGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Roots Intertwined at Base -->
    <path d="M256 360 C240 375 220 385 200 390 M256 360 C272 375 292 385 312 390" 
          stroke="url(#platGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Lower Branches -->
    <path d="M256 310 C210 300 170 270 156 225 M256 310 C302 300 342 270 356 225" 
          stroke="url(#platGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Upper Branches Spreading -->
    <path d="M256 265 C220 230 190 190 185 145 M256 265 C292 230 322 190 327 145" 
          stroke="url(#platGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Generational Heirloom Leaves / Nodes (Dots of Family Members) -->
    <circle cx="156" cy="225" r="10" fill="url(#goldGrad)"/>
    <circle cx="356" cy="225" r="10" fill="url(#goldGrad)"/>
    <circle cx="185" cy="145" r="11" fill="url(#goldGrad)"/>
    <circle cx="327" cy="145" r="11" fill="url(#goldGrad)"/>
    <circle cx="256" cy="120" r="13" fill="url(#goldGrad)"/>
    
    <!-- Central Vault Keystone Lock / Security Core -->
    <g transform="translate(256, 260)">
      <!-- Outer Lock Ring -->
      <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
      <!-- Inner Lock Inset -->
      <circle cx="0" cy="0" r="28" fill="#1c0a0f"/>
      <!-- Classic Vault Keyhole -->
      <circle cx="0" cy="-6" r="8" fill="url(#goldGrad)"/>
      <path d="M-5 -2 L5 -2 L8 12 L-8 12 Z" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
